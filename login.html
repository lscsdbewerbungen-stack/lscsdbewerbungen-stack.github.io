<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Anmeldung – LSCSD Bewerbungen</title>
<style>
  :root { --grund: #1B2342; --karte: #232d52; --akzent: #CEA067; --text: #F3EBDD; --gedimmt: #b9b2a5; --ok: #7ccf8f; --fehler: #ff8c7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--grund); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--karte); border: 1px solid #3a456f; border-radius: 16px; padding: 28px; text-align: center; }
  img { display: block; width: 96px; height: 96px; margin: 0 auto 12px; }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  p.unter { margin: 0 0 20px; color: var(--gedimmt); }
  button { width: 100%; padding: 12px 16px; border-radius: 10px; border: 0; font: inherit; font-weight: 600; cursor: pointer; background: #5865F2; color: #fff; }
  button:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
  #status { margin: 18px 0 0; min-height: 1.5em; font-weight: 600; }
  #status[data-art="ok"] { color: var(--ok); }
  #status[data-art="fehler"] { color: var(--fehler); }
</style>
</head>
<body>
<main>
  <img src="assets/logo-lscsd.png" alt="Abzeichen des Los Santos County Sheriff's Department">
  <h1>LSCSD Bewerbungen</h1>
  <p class="unter">Anmeldung</p>
  <button id="btn-login" type="button">Mit Discord anmelden</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
